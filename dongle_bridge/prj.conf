# Dongle bridge base config. RC LFCLK only (crystal unverified on dongle).
# Keepers are LIVE since 2026-08-10 (prj_keeper.conf); NEW bridge code still
# goes through the trial ladder first (prj_trial.conf) per DONGLE_SAFETY.md.

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_HCI_TX_STACK_SIZE=1536

# --- Clock: RC until crystal proven on THIS PCB ---
CONFIG_CLOCK_CONTROL_NRF=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL is not set

CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_PRINTK=y
CONFIG_REBOOT=y

# --- USB: CDC recovery + HID (classic stack, matches recovery.c) ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="NocFree Bridge"
CONFIG_USB_DEVICE_MANUFACTURER="NocFree"
CONFIG_USB_DEVICE_VID=0x2886
CONFIG_USB_DEVICE_PID=0x9029
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_HID=y
CONFIG_USB_HID_DEVICE_COUNT=1
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# --- BLE central (HOG client path; stubs first) ---
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=2
# OFF: as central we set conn params explicitly at create and enforce them in
# le_param_req (ble_hog_central.c host_link_param pin); the GAP auto-updater
# would fight the pin. (The old comment here described the opposite setting.)
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_DEVICE_NAME="NocFree Bridge"
CONFIG_BT_PRIVACY=n
CONFIG_BT_SETTINGS=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=n
CONFIG_BT_CTLR=y
CONFIG_BT_LL_SW_SPLIT=y
# Match left half Windows interop preference
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_SMP_SC_PAIR_ONLY=y
# Just Works OK for keyboard↔dongle (no display)
# CONFIG_BT_SMP_ENFORCE_MITM is not set
# Allow re-pair when left already has an older unauth bond for this identity
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# UF2 / code partition (GPREGRET written in software; no retention DTS)
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_USE_DT_CODE_PARTITION=y

# Recovery seatbelt (app Kconfig defaults y; restate for clarity)
CONFIG_NOCFREE_USB_RECOVERY=y

# Trial/keeper flags live in prj_trial.conf / prj_keeper.conf only. Bare
# prj.conf alone fails the CMake gate (must be trial XOR keeper).
