# Overlay for the TYPING-PASS trial round (2026-08-09 merge verification).
# Same dead-man's switch as trial.conf, but with a longer window so a full
# typing pass (every key, both layers, media row, backlight, OS switch) fits
# in one boot without re-flashing.
#
# ORDERING IS LOAD-BEARING: NOCFREE_TRIAL_AUTODFU_SECONDS must stay strictly
# below NOCFREE_TRIAL_AUTODFU_WDT_SECONDS (enforced by a BUILD_ASSERT in
# trial_autodfu.c). The watchdog is the backstop for a pre-USB hang; the
# timer is the normal self-return path.
CONFIG_NOCFREE_TRIAL_AUTODFU_SECONDS=300
CONFIG_NOCFREE_TRIAL_AUTODFU_WDT_SECONDS=360
