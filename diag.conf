# DIAG trial overlay — left BT visibility (2026-08-11).
# BONDFIX trial showed: first dongle pair attempt rejected (err 9), then left
# BLE went fully silent (no adv, no split reconnect) while USB stayed alive.
# Need ZMK/host logs on the CDC console to see the rejection and/or fault.
# Minimal logging only (BT_SMP/CONN/GATT DBG + Studio overflows flash by 75K).
# Pair with trial_nobond.conf: bonds KEPT (the one-time wipe already ran).
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_MAX_LEVEL=2
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n
CONFIG_NOCFREE_BATTERY_STOCK_CURVE=n
CONFIG_NOCFREE_BACKLIGHT_SYNC=n
