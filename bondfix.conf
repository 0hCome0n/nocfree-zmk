# TRIAL overlay — 2.4G bond-deadlock fix verification (2026-08-11).
#
# Evidence: dongle loops connect -> "security failed ... err 9" ->
# "pairing failed ... reason 9" (BT_SECURITY_ERR_UNSPECIFIED). Left refuses
# the bridge's fresh pair. Two suspected state faults, both flash-surviving:
#   1. stale profile-0 bond (ble.c auth_pairing_accept "taken profile"), and
#   2. orphan bonds from the thrash era (rotating dongle RPAs) filling
#      BT_MAX_PAIRED=6 (5 profiles + split) — Fn+Esc BT_CLR could not fix.
#
# One-time FULL bond wipe on boot purges both. Split re-bonds automatically;
# Windows BT needs one forget + re-pair afterwards. NEVER in a keeper
# (inner_build_*_keeper.sh hard-fails on it).
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y
