# Drop the LFCLK RC hedge: run the 32.768 kHz clock from the real crystal.
# The crystal was probe-proven on the LEFT pcb (2026-08-09, "LFXO RUNNING");
# probe the right before its keeper gets this. Motivation beyond power: the
# random split-link drop seen on the merged keepers is consistent with RC
# drift; XTAL is the fix candidate.
# Trial-only until the link has survived real use.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
