# BT-diagnosis trial overlay: stream connection/SMP/GATT logs over the
# existing recovery CDC (chosen zephyr,console = &cdc_acm_uart on the left).
# Deferred log mode (default) -- the IMMEDIATE+UART brick combo stays impossible.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
CONFIG_BT_CONN_LOG_LEVEL_DBG=y
CONFIG_BT_GATT_LOG_LEVEL_DBG=y
CONFIG_LOG_BUFFER_SIZE=8192
